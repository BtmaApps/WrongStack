# electron-builder configuration for WrongStack Desktop.
#
# Before this file existed, `build/Info.plist` and `build/entitlements.mac.plist`
# were complete, carefully commented, and referenced by nothing: there was no
# packaging step to merge or apply them. This is the step.
#
# Signing is OPT-IN and driven entirely by the environment, so an unsigned local
# build needs no credentials and no decisions:
#   macOS   CSC_LINK / CSC_KEY_PASSWORD (or a keychain identity) + APPLE_ID,
#           APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID to notarize
#   Windows CSC_LINK / CSC_KEY_PASSWORD
# With none of those set, electron-builder produces unsigned artifacts and says
# so. `afterSign` notarization is therefore not wired here — adding it would
# make every credential-less build fail.

appId: dev.wrongstack.desktop
productName: WrongStack
artifactName: 'wrongstack-desktop-${version}-${os}-${arch}.${ext}'
copyright: Copyright © WrongStack contributors

# Native modules are NOT rebuilt against Electron's ABI at package time.
#
# The only native module in the tree is `node-pty` (WebUI terminal panel),
# reached transitively through @wrongstack/webui-server. Rebuilding it requires
# MSVC + Python + the winpty build scripts on every machine that packages —
# precisely the burden the `node-pty: true` entry in pnpm-workspace.yaml exists
# to avoid, since that package ships prebuilt binaries.
#
# The WebUI child uses Electron's Node via ELECTRON_RUN_AS_NODE. Do not assume
# the prebuilds work just because packaging succeeds: smoke-desktop.mjs spawns
# a real PTY through the packaged runtime before CI uploads artifacts. The
# Windows x64 package passes this check without a native rebuild.
npmRebuild: false

directories:
  # Where Info.plist / entitlements.mac.plist / icon overrides are read from.
  buildResources: build
  output: release

# The app is built by `pnpm --filter @wrongstack/desktop build` (vite + esbuild)
# into dist/. Only the built output, the runtime assets the main process reads,
# and the manifest go into the bundle.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - assets/**/*
  - package.json
  # Trim what the runtime never reads. The bundle carries the whole WrongStack
  # tree (core pulls providers/sage/mcp/kanban/plugins), so these add up:
  # sourcemaps and .d.ts alone were ~2,900 and ~1,300 files.
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/**/{test,tests,__tests__,spec,coverage,example,examples,docs}/**'
  - '!node_modules/**/{.github,.vscode,.idea}/**'
  - '!node_modules/**/*.{tsbuildinfo,flow}'

# `icon` is a single 1024x1024 PNG; electron-builder derives .icns and .ico from
# it. See apps/desktop/assets/icon.svg for the editable source — Electron's
# nativeImage cannot decode SVG, which is why the raster is the shipped asset.
mac:
  icon: assets/icon.png
  category: public.app-category.developer-tools
  # Applies build/entitlements.mac.plist. Both keys are required: the inherit
  # file covers the helper processes, which crash on launch without it.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo: build/Info.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: 'wrongstack-desktop-${version}-win-${arch}-setup.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: 'wrongstack-desktop-${version}-win-${arch}-portable.${ext}'

linux:
  executableName: wrongstack-desktop
  # The deb target refuses to build without a maintainer, and package.json's
  # `author` is a bare name with no address to derive one from. Set here rather
  # than adding an email to the published manifest: this is packaging metadata,
  # and it only needs to name a contact for the .deb.
  maintainer: WrongStack contributors <ersinkoc@gmail.com>
  icon: assets/icon.png
  category: Development
  synopsis: Electron shell for managing multiple local WrongStack runtimes
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Release feed. electron-builder only uploads with an explicit
# `--publish always`, so declaring the provider here does not arm anything; it
# is what lets a future `electron-updater` client know where to look.
publish:
  provider: github
  owner: WrongStack
  repo: WrongStack
