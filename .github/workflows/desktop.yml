name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Package Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
          - os: macos-15
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild electron-winstaller esbuild node-pty
      - name: TEMP diagnose pnpm cmd shim
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > diag.mjs <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';
          const comspec = process.env.COMSPEC ?? 'cmd.exe';
          const show = (label, fn) => {
            try { console.log(`### ${label}\n${fn()}`); }
            catch (e) { console.log(`### ${label}\nTHREW: ${e.message}\nstdout=${e.stdout}\nstderr=${e.stderr}`); }
          };
          show('where pnpm', () =>
            execFileSync(comspec, ['/d', '/c', 'where pnpm'], { encoding: 'utf8' }));
          show('PATH entries with pnpm', () =>
            (process.env.Path ?? process.env.PATH ?? '').split(';').filter((p) => /pnpm/i.test(p)).join('\n'));
          const shim = (() => {
            try {
              return execFileSync(comspec, ['/d', '/c', 'where pnpm'], { encoding: 'utf8' })
                .split(/\r?\n/).find((l) => l.toUpperCase().endsWith('.CMD'));
            } catch { return undefined; }
          })();
          show('shim path', () => String(shim));
          show('shim contents', () => (shim && existsSync(shim) ? readFileSync(shim, 'utf8') : 'NO .CMD SHIM FOUND'));
          show('verbatim call "pnpm" "--version"', () =>
            execFileSync(comspec, ['/d', '/c', 'call "pnpm" "--version"'],
              { encoding: 'utf8', windowsVerbatimArguments: true }));
          show('verbatim call "pnpm" "--version" with cwd=repo', () =>
            execFileSync(comspec, ['/d', '/c', 'call "pnpm" "--version"'],
              { encoding: 'utf8', windowsVerbatimArguments: true, cwd: process.cwd() }));
          show('non-verbatim call pnpm --version', () =>
            execFileSync(comspec, ['/d', '/c', 'call pnpm --version'], { encoding: 'utf8' }));
          EOF
          node diag.mjs
      - name: Package (no publishing credentials)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package-desktop.mjs ${{ matrix.target }} --publish never
      - name: Check packaged dependencies and assets with Electron
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs --window
      - name: Check Linux Desktop with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs --window
      - name: Namespace package-owned checksum manifest
        env:
          DESKTOP_MATRIX_OS: ${{ matrix.os }}
        run: node -e "const fs=require('node:fs');const dir='.temp_files/package-desktop-stage/release';fs.renameSync(dir+'/SHA256SUMS.txt',dir+'/DESKTOP-SHA256SUMS-'+process.env.DESKTOP_MATRIX_OS)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name || format('desktop-{0}', github.run_id) }}-${{ matrix.os }}
          path: |
            .temp_files/package-desktop-stage/release/wrongstack-desktop-*
            .temp_files/package-desktop-stage/release/DESKTOP-SHA256SUMS-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
