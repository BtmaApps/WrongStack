name: Deploy Website

# Builds the marketing/docs site in website/ and publishes it to GitHub Pages
# at the apex domain wrongstack.com (CNAME lives in website/public/CNAME, which
# Vite copies into the build output). Pages "Source" must be set to
# "GitHub Actions" in the repository settings for this to deploy.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # Workspace-owned tooling supplies the website verification dependencies.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # wrongstack.com/install.{sh,ps1} are emitted from these at build time.
      - 'scripts/install/install.sh'
      - 'scripts/install/install.ps1'
      # The website build validates these source-owned catalogs. Trigger the
      # deploy workflow when they change so stale operator pages fail visibly.
      - 'packages/tools/src/builtin.ts'
      - 'packages/tools/src/browser/tools.ts'
      - 'packages/cli/src/plugin-management.ts'
      - 'packages/core/src/types/mode.ts'
      - 'packages/core/src/coordination/fleet.ts'
      - 'packages/core/src/coordination/agents/phase*.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# WS-014: `pages: write` and `id-token: write` are declared per-job, not here.
# At workflow level the build job inherits them while running `npm ci` and
# `vite build` over the website's own dependency tree — arbitrary third-party
# code. A compromised dependency there could mint an OIDC token or deploy to
# wrongstack.com, bypassing the `github-pages` environment gate entirely. The
# build job only needs to read the repo.
permissions:
  contents: read

# Only one Pages deploy at a time. Don't cancel an in-flight deploy — a half-
# applied deployment is worse than waiting for the previous one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Test tooling belongs to the workspace. Keep its pnpm install isolated from
  # the standalone npm dependency tree that produces the deployed artifact.
  website-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Match CI's reviewed native set; do not execute arbitrary install scripts.
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild electron-winstaller esbuild node-pty

      - name: TypeCheck (website tests)
        run: pnpm --filter wrongstack-website typecheck:tests

      - name: Test (website)
        run: pnpm --filter wrongstack-website test

  build:
    needs: website-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Third-party actions pinned to full commit SHAs (see ci.yml for rationale).
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          persist-credentials: false

      # Keep the deployed artifact on its standalone npm lockfile. Workspace
      # test dependencies are installed only in the separate website-checks job.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node 24 runtime, pinned 2026-09-06)

      # `--ignore-scripts`: pnpm's lifecycle allowlist does not govern this npm
      # install. Audit the standalone production lockfile separately (WS-014).
      - name: Install dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit website dependencies
        working-directory: website
        run: npm audit --audit-level=moderate

      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (resolved 2026-05-29)
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node 24 runtime, pinned 2026-09-06)
