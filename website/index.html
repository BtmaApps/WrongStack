    <meta name="theme-color" content="oklch(18% 0.01 260)" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="WrongStack — AI coding, under your control" />
    <meta
      property="og:description"
      content="WrongStack 1.0.33: complete ChatGPT account catalogs, safe OAuth token rotation, Scout, 71 tools, and durable project memory."

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WrongStack — AI coding, under your control" />
    <meta name="twitter:description" content="WrongStack 1.0.33: complete ChatGPT account catalogs, safe OAuth token rotation, Scout, and durable project memory." />
    <meta name="twitter:image" content="https://wrongstack.com/og.png" />

    <link rel="canonical" href="https://wrongstack.com" />

    <title>WrongStack — AI coding, under your control</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "WrongStack",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS, Linux, Windows",
        "description": "A free and open-source AI coding agent with Scout, optional execution sandbox tiers, post-edit LSP feedback, project-learning fleets, 71 built-in tools, 99 managed plugins, 37 bundled skills, and six interfaces.",
        "url": "https://wrongstack.com",
        "softwareVersion": "1.0.33",
        "dateModified": "2026-10-05T00:00:00Z",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/WrongStack/WrongStack"
      }
    </script>
    <!-- Apply persisted theme before paint to avoid a flash -->
    <script>
      (() => {
        try {
          var t = localStorage.getItem("theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || ((t === null || t === "system") && sysDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
